<!DOCTYPE html>

</head>
<body>

<div id="chartW" class="panel"></div>
<script>
const data = {"title": "同花顺 (300033.SZ) 波浪结构", "monthly": [], "monthly_wave": [{"label": "前高", "date": "2016-11-30", "price": 81.07, "type": "HIGH"}, {"label": "起点", "date": "2018-10-31", "price": 28.48, "type": "LOW"}, {"label": "浪1顶", "date": "2018-11-30", "price": 46.84, "type": "HIGH", "detail": {"sub_wave_warning": true, "gain_pct": 64.5, "note": "单浪涨幅64.5%>50%，可能内含子浪未细分"}}, {"label": "浪2底", "date": "2019-01-31", "price": 36.6, "type": "LOW"}, {"label": "浪3顶", "date": "2019-04-30", "price": 134.56, "type": "HIGH"}, {"label": "浪4底", "date": "2019-05-31", "price": 74.1, "type": "LOW"}, {"label": "浪5顶", "date": "2020-07-31", "price": 187.99, "type": "HIGH"}, {"label": "调整A浪底", "date": "2020-08-31", "price": 134.01, "type": "LOW"}, {"label": "调整B浪顶", "date": "2020-09-30", "price": 179.78, "type": "HIGH"}, {"label": "调整C浪底", "date": "2020-12-31", "price": 114.07, "type": "LOW"}, {"label": "续1顶", "date": "2022-06-30", "price": 106.1, "type": "HIGH"}, {"label": "续2底", "date": "2022-10-31", "price": 74.5, "type": "LOW"}, {"label": "续3顶", "date": "2023-04-30", "price": 239.22, "type": "HIGH"}, {"label": "续4底", "date": "2023-05-31", "price": 151.2, "type": "LOW"}, {"label": "续5顶", "date": "2023-06-30", "price": 222.8, "type": "HIGH"}, {"label": "续A浪底", "date": "2023-07-31", "price": 155.55, "type": "LOW"}, {"label": "续B浪顶", "date": "2023-08-31", "price": 213.8, "type": "HIGH"}, {"label": "续C浪底", "date": "2023-10-31", "price": 134.39, "type": "LOW"}, {"label": "联合调整X浪顶", "date": "2021-02-28", "price": 164.96, "type": "HIGH"}, {"label": "联合调整Y浪底", "date": "2021-05-31", "price": 101.41, "type": "LOW"}, {"label": "联合调整Y浪顶", "date": "2021-06-30", "price": 119.3, "type": "HIGH"}, {"label": "联合调整Z浪底", "date": "2021-08-31", "price": 91.25, "type": "LOW"}, {"label": "续1顶", "date": "2023-06-30", "price": 222.8, "type": "HIGH"}, {"label": "续2底", "date": "2023-07-31", "price": 155.55, "type": "LOW"}, {"label": "续3顶", "date": "2023-08-31", "price": 213.8, "type": "HIGH"}, {"label": "续4底", "date": "2023-10-31", "price": 134.39, "type": "LOW"}, {"label": "续5顶", "date": "2023-12-31", "price": 168.38, "type": "HIGH"}, {"label": "续A浪底", "date": "2024-02-29", "price": 104.06, "type": "LOW"}, {"label": "续B浪顶", "date": "2024-03-31", "price": 154.09, "type": "HIGH"}, {"label": "续C浪底", "date": "2024-04-30", "price": 109.47, "type": "LOW"}], "weekly": [], "weekly_wave": [], "fib": [["0%", 435.0], ["23.6%", 339.06128], ["38.2%", 279.70936], ["50%", 231.74], ["61.8%", 183.77064000000001], ["78.6%", 115.47528], ["100%", 28.48]], "supports": [180], "resistances": [220], "current": 219.5};
const T = function(d) { return new Date(d).getTime(); };

const markLines = [];
data.fib.forEach(function(it) {
    markLines.push({yAxis: it[1], name: 'Fib ' + it[0], lineStyle: {type: 'dashed', color: '#999999'}, label: {formatter: it[0] + ' ' + it[1].toFixed(2), position: 'insideEndTop'}});
});
data.supports.forEach(function(v) {
    markLines.push({yAxis: v, name: '支撑', lineStyle: {color: '#2e7d32'}, label: {formatter: '支撑 ' + v.toFixed(2), position: 'insideEndTop'}});
});
data.resistances.forEach(function(v) {
    markLines.push({yAxis: v, name: '阻力', lineStyle: {color: '#c62828'}, label: {formatter: '阻力 ' + v.toFixed(2), position: 'insideEndTop'}});
});
if (data.current != null) {
    markLines.push({yAxis: data.current, name: '现价', lineStyle: {color: '#ef6c00'}, label: {formatter: '现价 ' + data.current.toFixed(2), position: 'insideEndTop'}});
}

function buildOption(title, series, wavePts) {
    return {
        title: {text: title, left: 'center', textStyle: {fontSize: 15, fontWeight: 'bold'}},
        tooltip: {
            trigger: 'axis',
            axisPointer: {type: 'cross'},
            formatter: function(params) {
                const lines = [];
                params.forEach(function(p) {
                    if (p.seriesType === 'line' && p.value && p.value.length) {
                        lines.push(new Date(p.value[0]).toISOString().slice(0,10) + ' 收盘: ' + p.value[1].toFixed(2));
                    }
                    if (p.seriesType === 'scatter' && p.value) {
                        lines.push(p.name + ' @ ' + p.value[1].toFixed(2));
                    }
                });
                return lines.join('<br/>');
            }
        },
        legend: {data: ['收盘', '波浪转折点'], top: 26},
        grid: {left: 60, right: 40, top: 60, bottom: 35},
        xAxis: {type: 'time'},
        yAxis: {type: 'value', scale: true},
        series: [
            {
                name: '收盘',
                type: 'line',
                data: series.map(function(m) { return [T(m.date), m.close]; }),
                showSymbol: false,
                lineStyle: {color: '#90a4ae', width: 1.5},
                markLine: {symbol: 'none', data: markLines, label: {position: 'insideEndTop'}},
            },
            {
                name: '波浪转折点',
                type: 'scatter',
                data: wavePts.map(function(w) { return {name: w.label, value: [T(w.date), w.price]}; }),
                symbolSize: 13,
                itemStyle: {color: '#1e88e5'},
                label: {show: true, position: 'top', formatter: function(p) { return p.name; }, fontSize: 11, color: '#333'},
            }
        ]
    };
}

const chartM = echarts.init(document.getElementById('chartM'));
chartM.setOption(buildOption('月线波浪结构（大级别趋势）', data.monthly, data.monthly_wave));
const chartW = echarts.init(document.getElementById('chartW'));
chartW.setOption(buildOption('周线波浪结构（中长期趋势）', data.weekly, data.weekly_wave));
window.addEventListener('resize', function() { chartM.resize(); chartW.resize(); });
</script>
</body>
</html>
