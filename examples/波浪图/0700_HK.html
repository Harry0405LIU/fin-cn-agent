<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>腾讯控股 (0700.HK) 波浪结构</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>body{margin:0;font-family:-apple-system,"PingFang SC",sans-serif;background:#fafafa;} .panel{width:100vw;height:48vh;}</style>
</head>
<body>
<div id="chartM" class="panel"></div>
<div id="chartW" class="panel"></div>
<script>
const data = {"title": "腾讯控股 (0700.HK) 波浪结构", "monthly": [], "monthly_wave": [{"label": "前低", "date": "2016-12-31", "price": 158.7903, "type": "LOW"}, {"label": "起点", "date": "2021-02-28", "price": 692.5265, "type": "HIGH"}, {"label": "浪1底", "date": "2021-08-31", "price": 369.1008, "type": "LOW"}, {"label": "浪2顶", "date": "2021-09-30", "price": 473.6883, "type": "HIGH"}, {"label": "浪3底", "date": "2022-01-31", "price": 376.9806, "type": "LOW"}, {"label": "浪4顶", "date": "2022-02-28", "price": 450.2109, "type": "HIGH"}, {"label": "浪5底", "date": "2022-03-31", "price": 274.0013, "type": "LOW", "detail": {"sub_wave_warning": true, "decline_pct": 60.4, "note": "单浪跌幅60.4%>50%，可能内含子浪未细分"}}, {"label": "调整A浪顶", "date": "2022-04-30", "price": 360.7222, "type": "HIGH"}, {"label": "调整B浪底", "date": "2022-05-31", "price": 304.4459, "type": "LOW"}, {"label": "调整C浪顶", "date": "2022-06-30", "price": 377.0638, "type": "HIGH"}, {"label": "续1底", "date": "2024-01-31", "price": 255.7391, "type": "LOW"}, {"label": "续2顶", "date": "2024-10-31", "price": 478.2254, "type": "HIGH"}, {"label": "续3底", "date": "2025-01-31", "price": 361.6431, "type": "LOW"}, {"label": "续4顶", "date": "2025-03-31", "price": 542.2663, "type": "HIGH"}, {"label": "续5底", "date": "2025-04-30", "price": 415.374, "type": "LOW"}, {"label": "续A浪顶", "date": "2025-10-31", "price": 683.0, "type": "HIGH"}, {"label": "续B浪底", "date": "2026-06-30", "price": 411.0, "type": "LOW"}, {"label": "续C浪顶", "date": "2026-08-31", "price": 497.8, "type": "HIGH"}, {"label": "联合调整X浪底", "date": "2022-10-31", "price": 184.0828, "type": "LOW"}, {"label": "联合调整Y浪顶", "date": "2023-01-31", "price": 406.5658, "type": "HIGH"}, {"label": "联合调整Y浪底", "date": "2023-03-31", "price": 322.442, "type": "LOW"}, {"label": "联合调整Z浪顶", "date": "2023-04-30", "price": 381.5824, "type": "HIGH"}, {"label": "续1顶", "date": "2025-10-31", "price": 683.0, "type": "HIGH"}, {"label": "续2底", "date": "2026-06-30", "price": 411.0, "type": "LOW"}, {"label": "续3顶", "date": "2026-08-31", "price": 497.8, "type": "HIGH"}], "weekly": [], "weekly_wave": [], "fib": [["0%", 692.5265], ["23.6%", 566.5647568], ["38.2%", 488.63927160000003], ["50%", 425.65840000000003], ["61.8%", 362.6775284], ["78.6%", 273.0098468], ["100%", 158.7903]], "supports": [430], "resistances": [450], "current": 433.0};
const T = function(d) { return new Date(d).getTime(); };

const markLines = [];
data.fib.forEach(function(it) {
    markLines.push({yAxis: it[1], name: 'Fib ' + it[0], lineStyle: {type: 'dashed', color: '#999999'}, label: {formatter: it[0] + ' ' + it[1].toFixed(2), position: 'insideEndTop'}});
});
data.supports.forEach(function(v) {
    markLines.push({yAxis: v, name: '支撑', lineStyle: {color: '#2e7d32'}, label: {formatter: '支撑 ' + v.toFixed(2), position: 'insideEndTop'}});
});
data.resistances.forEach(function(v) {
    markLines.push({yAxis: v, name: '阻力', lineStyle: {color: '#c62828'}, label: {formatter: '阻力 ' + v.toFixed(2), position: 'insideEndTop'}});
});
if (data.current != null) {
    markLines.push({yAxis: data.current, name: '现价', lineStyle: {color: '#ef6c00'}, label: {formatter: '现价 ' + data.current.toFixed(2), position: 'insideEndTop'}});
}

function buildOption(title, series, wavePts) {
    return {
        title: {text: title, left: 'center', textStyle: {fontSize: 15, fontWeight: 'bold'}},
        tooltip: {
            trigger: 'axis',
            axisPointer: {type: 'cross'},
            formatter: function(params) {
                const lines = [];
                params.forEach(function(p) {
                    if (p.seriesType === 'line' && p.value && p.value.length) {
                        lines.push(new Date(p.value[0]).toISOString().slice(0,10) + ' 收盘: ' + p.value[1].toFixed(2));
                    }
                    if (p.seriesType === 'scatter' && p.value) {
                        lines.push(p.name + ' @ ' + p.value[1].toFixed(2));
                    }
                });
                return lines.join('<br/>');
            }
        },
        legend: {data: ['收盘', '波浪转折点'], top: 26},
        grid: {left: 60, right: 40, top: 60, bottom: 35},
        xAxis: {type: 'time'},
        yAxis: {type: 'value', scale: true},
        series: [
            {
                name: '收盘',
                type: 'line',
                data: series.map(function(m) { return [T(m.date), m.close]; }),
                showSymbol: false,
                lineStyle: {color: '#90a4ae', width: 1.5},
                markLine: {symbol: 'none', data: markLines, label: {position: 'insideEndTop'}},
            },
            {
                name: '波浪转折点',
                type: 'scatter',
                data: wavePts.map(function(w) { return {name: w.label, value: [T(w.date), w.price]}; }),
                symbolSize: 13,
                itemStyle: {color: '#1e88e5'},
                label: {show: true, position: 'top', formatter: function(p) { return p.name; }, fontSize: 11, color: '#333'},
            }
        ]
    };
}

const chartM = echarts.init(document.getElementById('chartM'));
chartM.setOption(buildOption('月线波浪结构（大级别趋势）', data.monthly, data.monthly_wave));
const chartW = echarts.init(document.getElementById('chartW'));
chartW.setOption(buildOption('周线波浪结构（中长期趋势）', data.weekly, data.weekly_wave));
window.addEventListener('resize', function() { chartM.resize(); chartW.resize(); });
</script>
</body>
</html>
