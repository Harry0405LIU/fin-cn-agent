function buildOption(subtitle, series, wavePts) {
    return {
        title: {text: subtitle, left: 'center', textStyle: {fontSize: 13, color: '#555'}},
        tooltip: {
            trigger: 'axis',
            axisPointer: {type: 'cross'},
            formatter: function(params) {
