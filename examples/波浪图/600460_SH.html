<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>士兰微 (600460.SH) 波浪结构</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>body{margin:0;font-family:-apple-system,"PingFang SC",sans-serif;background:#fafafa;} .panel{width:100vw;height:48vh;}</style>
</head>
<body>
<div id="chartM" class="panel"></div>
<div id="chartW" class="panel"></div>
<script>
const data = {"title": "士兰微 (600460.SH) 波浪结构", "monthly": [], "monthly_wave": [{"label": "前高", "date": "2016-11-30", "price": 7.04, "type": "HIGH"}, {"label": "起点", "date": "2017-01-31", "price": 5.56, "type": "LOW"}, {"label": "浪1顶", "date": "2017-03-31", "price": 6.89, "type": "HIGH"}, {"label": "浪2底", "date": "2017-04-30", "price": 5.82, "type": "LOW"}, {"label": "浪3顶", "date": "2018-01-31", "price": 17.17, "type": "HIGH"}, {"label": "浪4底", "date": "2018-02-28", "price": 12.15, "type": "LOW"}, {"label": "浪5顶", "date": "2018-03-31", "price": 17.34, "type": "HIGH", "detail": {"sub_wave_warning": true, "gain_pct": 211.9, "note": "单浪涨幅211.9%>50%，可能内含子浪未细分"}}, {"label": "调整A浪底", "date": "2018-06-30", "price": 11.12, "type": "LOW"}, {"label": "调整B浪顶", "date": "2018-07-31", "price": 14.3, "type": "HIGH"}, {"label": "调整C浪底", "date": "2018-10-31", "price": 8.22, "type": "LOW"}, {"label": "联合调整X浪顶", "date": "2018-11-30", "price": 9.98, "type": "HIGH"}, {"label": "联合调整Y浪底", "date": "2019-01-31", "price": 7.97, "type": "LOW"}, {"label": "联合调整Y浪顶", "date": "2019-03-31", "price": 20.25, "type": "HIGH"}, {"label": "联合调整Z浪底", "date": "2019-05-31", "price": 12.66, "type": "LOW"}, {"label": "续1顶", "date": "2021-01-31", "price": 30.96, "type": "HIGH"}, {"label": "续2底", "date": "2021-02-28", "price": 20.75, "type": "LOW"}, {"label": "续3顶", "date": "2021-07-31", "price": 74.78, "type": "HIGH"}, {"label": "续4底", "date": "2021-09-30", "price": 51.78, "type": "LOW"}, {"label": "续5顶", "date": "2021-11-30", "price": 69.99, "type": "HIGH"}, {"label": "续A浪底", "date": "2022-01-31", "price": 47.99, "type": "LOW"}, {"label": "续B浪顶", "date": "2022-03-31", "price": 61.69, "type": "HIGH"}, {"label": "续C浪底", "date": "2022-04-30", "price": 35.78, "type": "LOW"}], "weekly": [], "weekly_wave": [], "fib": [["0%", 74.78], ["23.6%", 58.44408], ["38.2%", 48.33796], ["50%", 40.17], ["61.8%", 32.00204], ["78.6%", 20.37308], ["100%", 5.56]], "supports": [20.8], "resistances": [32.0], "current": 31.23};
const T = function(d) { return new Date(d).getTime(); };

const markLines = [];
data.fib.forEach(function(it) {
    markLines.push({yAxis: it[1], name: 'Fib ' + it[0], lineStyle: {type: 'dashed', color: '#999999'}, label: {formatter: it[0] + ' ' + it[1].toFixed(2), position: 'insideEndTop'}});
});
data.supports.forEach(function(v) {
    markLines.push({yAxis: v, name: '支撑', lineStyle: {color: '#2e7d32'}, label: {formatter: '支撑 ' + v.toFixed(2), position: 'insideEndTop'}});
});
data.resistances.forEach(function(v) {
    markLines.push({yAxis: v, name: '阻力', lineStyle: {color: '#c62828'}, label: {formatter: '阻力 ' + v.toFixed(2), position: 'insideEndTop'}});
});
if (data.current != null) {
    markLines.push({yAxis: data.current, name: '现价', lineStyle: {color: '#ef6c00'}, label: {formatter: '现价 ' + data.current.toFixed(2), position: 'insideEndTop'}});
}

function buildOption(title, series, wavePts) {
    return {
        title: {text: title, left: 'center', textStyle: {fontSize: 15, fontWeight: 'bold'}},
        tooltip: {
            trigger: 'axis',
            axisPointer: {type: 'cross'},
            formatter: function(params) {
                const lines = [];
                params.forEach(function(p) {
                    if (p.seriesType === 'line' && p.value && p.value.length) {
                        lines.push(new Date(p.value[0]).toISOString().slice(0,10) + ' 收盘: ' + p.value[1].toFixed(2));
                    }
                    if (p.seriesType === 'scatter' && p.value) {
                        lines.push(p.name + ' @ ' + p.value[1].toFixed(2));
                    }
                });
                return lines.join('<br/>');
            }
        },
        legend: {data: ['收盘', '波浪转折点'], top: 26},
        grid: {left: 60, right: 40, top: 60, bottom: 35},
        xAxis: {type: 'time'},
        yAxis: {type: 'value', scale: true},
        series: [
            {
                name: '收盘',
                type: 'line',
                data: series.map(function(m) { return [T(m.date), m.close]; }),
                showSymbol: false,
                lineStyle: {color: '#90a4ae', width: 1.5},
                markLine: {symbol: 'none', data: markLines, label: {position: 'insideEndTop'}},
            },
            {
                name: '波浪转折点',
                type: 'scatter',
                data: wavePts.map(function(w) { return {name: w.label, value: [T(w.date), w.price]}; }),
                symbolSize: 13,
                itemStyle: {color: '#1e88e5'},
                label: {show: true, position: 'top', formatter: function(p) { return p.name; }, fontSize: 11, color: '#333'},
            }
        ]
    };
}

const chartM = echarts.init(document.getElementById('chartM'));
chartM.setOption(buildOption('月线波浪结构（大级别趋势）', data.monthly, data.monthly_wave));
const chartW = echarts.init(document.getElementById('chartW'));
chartW.setOption(buildOption('周线波浪结构（中长期趋势）', data.weekly, data.weekly_wave));
window.addEventListener('resize', function() { chartM.resize(); chartW.resize(); });
</script>
</body>
</html>
